<!DOCTYPE html>
<html>
<head>
    <title>Tip Calculator</title>
</head>
<body>
    <h2>Restaurant Tip Calculator</h2>

    <form action="TipServlet" method="post">
        Bill Amount: 
        <input type="number" name="billAmount" step="0.01" required><br><br>

        Tip Percentage:
        <select name="tipPercent">
            <option value="5">5%</option>
            <option value="10">10%</option>
            <option value="15">15%</option>
            <option value="20">20%</option>
        </select><br><br>

        <input type="submit" value="Calculate">
    </form>
</body>
</html>
